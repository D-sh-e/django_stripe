{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата через Stripe</title>
        <link rel="stylesheet" href="{% static 'shop/css/main.css' %}">
    <script src="https://js.stripe.com/v3/"></script>
 
</head>
<body>
    <div class="payment_intent">
        <h1>Оплата товара</h1>
        <p><b>Товар:</b> {{ item.name }}</p>
        <p><b>Сумма:</b> {{ item.price }} usd</p>

        <div id="payment-element"></div>
        <button id="pay-button">Оплатить</button>

    </div>

    <script>

        const stripe = Stripe('{{ stripe_public_key }}');

        const elements = stripe.elements({
            mode: 'payment',
            currency: 'usd',
            amount: {{ price_cents }},
        });


        const paymentElement = elements.create('payment');
        paymentElement.mount('#payment-element');

        const payButton = document.getElementById('pay-button');

        payButton.addEventListener('click', async function() {
        // Проверка корректно ли заполнены поля формы
        const { error: submitError } = await elements.submit();
        if (submitError) {
            alert('Ошибка: ' + submitError.message);
            return;
        }
        // Оплата
        const { error, paymentIntent } = await stripe.confirmPayment({
                    elements: elements,
                    clientSecret: '{{ client_secret }}',
                    confirmParams: {
                    return_url: window.location.origin + '/success/',
                }
            });

            if (error) {
                alert('Ошибка: ' + error.message);
            } 
            else if (paymentIntent.status === 'succeeded') {
                alert('Оплата выполнена');
            }
        });
    </script>
</body>
</html>
